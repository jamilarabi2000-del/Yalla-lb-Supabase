name: Repair ShopContext

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-shopcontext.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore ShopContext from verified Supabase parent
        run: |
          git checkout 01da104b96f178a920fdf7704853e601b52666bb -- src/context/ShopContext.tsx

      - name: Commit restored file
        run: |
          if git diff --quiet -- src/context/ShopContext.tsx; then
            echo 'ShopContext already matches the verified parent.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/ShopContext.tsx
          git commit -m 'fix: restore complete Supabase ShopContext implementation'
          git push
