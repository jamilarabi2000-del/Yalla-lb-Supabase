name: repair-shopcontext
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'chore: restore ShopContext from known-good commit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good ShopContext
        run: |
          git fetch origin main
          git checkout 01da104b96f178a920fdf7704853e601b52666bb -- src/context/ShopContext.tsx
      - name: Restore Supabase EmailOtpType compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/context/ShopContext.tsx')
          s=p.read_text()
          s=s.replace("verifyEmailOtp: (email: string, token: string, type?: 'email' | 'signup' | 'magiclink' | 'recovery') => Promise<void>;", "verifyEmailOtp: (email: string, token: string, type?: EmailOtpType) => Promise<void>;")
          s=s.replace("const verifyEmailOtp = async (email: string, token: string, type: 'email' | 'signup' | 'magiclink' | 'recovery' = 'email') => {", "const verifyEmailOtp = async (email: string, token: string, type: EmailOtpType = 'email') => {")
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/context/ShopContext.tsx
          git diff --cached --quiet || git commit -m 'chore: restore ShopContext from known-good commit'
          git push
