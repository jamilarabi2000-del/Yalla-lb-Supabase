name: Repair verify type errors v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'jamilarabi2000-del'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def rx(path, pattern, repl, count=0):
              p=Path(path); s=p.read_text(); ns,n=re.subn(pattern,repl,s,count=count)
              if n==0: raise SystemExit(f'pattern not found in {path}: {pattern}')
              p.write_text(ns)

          # OrderHistory optional snapshot data.
          rx('src/components/OrderHistory.tsx', r'docSnap\.data\(\)\.userId', r'(docSnap.data() as Order).userId')

          # Explicitly type legacy Supabase compatibility callbacks.
          rx('src/context/ShopContext.tsx', r'rows\.map\(\(row\) =>', r'rows.map((row: Record<string, any>) =>')
          rx('src/context/ShopContext.tsx', r'\.subscribe\(\(status\) =>', r'.subscribe((status: string) =>')
          rx('src/context/ShopContext.tsx', r'\.then\(\(\{ data: \{ session \}, error \}\) =>', r'.then(({ data: { session }, error }: { data: { session: Session | null }; error: AuthError | null }) =>')
          rx('src/context/ShopContext.tsx', r'\}\.catch\(\(err\) =>', r'}).catch((err: unknown) =>')
          rx('src/context/ShopContext.tsx', r'\.onAuthStateChange\(\(event, session\) =>', r'.onAuthStateChange((event: AuthChangeEvent, session: Session | null) =>')

          p=Path('src/context/ShopContext.tsx'); s=p.read_text()
          s=s.replace("  User as SupabaseUser,\n  EmailOtpType\n", "  User as SupabaseUser,\n  EmailOtpType,\n  Session,\n  AuthChangeEvent,\n  AuthError\n")
          p.write_text(s)

          # Firebase compatibility auth listener.
          p=Path('src/firebase.ts'); s=p.read_text()
          s=s.replace("  User as SupabaseUser,\n", "  User as SupabaseUser,\n  Session,\n  AuthChangeEvent,\n")
          s=s.replace('(_event, session)', '(_event: AuthChangeEvent, session: Session | null)', 1)
          p.write_text(s)

          # Generic database monitor must return the caller's T.
          rx('src/utils/databaseMonitor.ts', r'    return snapshot;\n', r'    return snapshot as DocumentSnapshot<T>;\n', count=1)
          PY

          # Show the remaining compiler errors, but commit the targeted fixes so CI can validate them.
          npm install --no-audit --no-fund >/dev/null 2>&1
          npm run lint || true

      - name: Remove temporary workflows and commit
        run: |
          rm -f .github/workflows/repair-verify-types.yml .github/workflows/repair-verify-types-v2.yml .github/workflows/inspect-type-context.yml REPAIR_TRIGGER.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: resolve remaining compatibility type errors' || exit 0
          git push origin main
