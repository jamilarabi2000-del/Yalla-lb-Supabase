name: Inspect remaining type contexts
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print relevant contexts
        run: |
          for f in src/context/ShopContext.tsx src/firebase.ts src/utils/databaseMonitor.ts src/components/OrderHistory.tsx; do
            echo "===== $f ====="
            case "$f" in
              src/context/ShopContext.tsx) for r in '1018,1032' '1569,1583' '2479,2493' '2568,2582' '2820,2845' '3447,3458'; do sed -n "${r}p" "$f"; echo '---'; done;;
              src/firebase.ts) sed -n '90,101p' "$f";;
              src/utils/databaseMonitor.ts) sed -n '538,550p' "$f";;
              src/components/OrderHistory.tsx) sed -n '108,118p' "$f";;
            esac
          done
          exit 1
