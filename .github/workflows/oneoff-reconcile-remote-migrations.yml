name: oneoff reconcile remote migration history
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  reconcile:
    if: contains(github.event.head_commit.message, 'reconcile full remote migration history')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add compatibility markers for remote migration versions
        shell: python
        run: |
          from pathlib import Path
          versions = '''
          20260912213002 yalla_core_schema_v2
          20260912213014 yalla_security_hardening
          20260912213402 yalla_storage_and_api_access
          20260912213413 yalla_auth_and_order_guards
          20260912213417 yalla_auth_function_grants_cleanup
          20260912213424 yalla_order_function_schema_lockdown
          20260912213535 yalla_review_integrity_and_checkout_hardening
          20260912213629 yalla_checkout_validation_foundation
          20260912213634 yalla_checkout_race_protection
          20260912214054 catalog_migration_bridge
          20260912214130 cms_slider_content_model
          20260912214344 secure_public_catalog_visibility
          20260912215811 add_missing_foreign_key_indexes
          20260913134158 secure_reviews
          20260913161053 harden_storage
          20260913174811 product_bundle_presentation_columns
          20260913180628 protect_seller_application_status
          20260913210653 admin_delete_order_rpc
          20260913210928 phone_availability_check
          20260913235452 harden_policy_roles_and_trigger_functions
          20260913235506 tighten_authenticated_policy_scope
          20260913235600 remove_public_trigger_function_execute
          20260914111222 harden_security_definer_rpc_grants
          20260914111307 restore_required_auth_rpc_grants
          20260914111325 optimize_rls_core_auth_calls
          20260914111343 optimize_rls_checkout_orders
          20260914111353 optimize_rls_catalog_and_sellers
          20260914111359 optimize_rls_search_and_seller_apps
          20260914111406 optimize_rls_reviews
          20260914111414 optimize_rls_order_items
          20260914111421 optimize_rls_remaining
          20260914111436 secure_rpc_api_exposure
          20260914111458 optimize_rls_cms_reads
          20260914111506 optimize_rls_admin_policy_calls
          20260914113955 optimize_phone_registry_auth_uid
          20260915010406 security_hardening_private_helpers_and_grants
          20260915010426 remove_public_security_definer_helpers
          20260915010504 secure_public_catalog_view_and_private_defaults
          20260915010525 add_checkout_and_review_abuse_controls
          20260915010817 split_public_and_authenticated_read_policies
          20260915010917 allow_trusted_server_writes_in_security_triggers
          20260915011006 remove_direct_trigger_function_execution
          20260915011246 expand_product_catalog_model
          20260915011315 lock_down_future_public_table_grants
          20260915011351 protect_public_product_cost_columns
          20260915011403 enforce_product_column_least_privilege
          20260915012002 remove_duplicate_review_index
          20260915012216 protect_product_operational_fields
          20260915012407 harden_admin_audit_log
          20260915013945 platform_authorization_inventory_search_order_notifications
          20260915184113 harden_product_and_review_mutations
          20260915184300 harden_storage_object_metadata
          20260915190257 harden_inventory_ledger_and_stock_adjustments
          20260915190855 test_inventory_context_helper
          20260915190903 fix_inventory_adjustment_context
          20260915191011 create_checkout_inventory_context_wrapper
          20260915191018 expose_audited_checkout_only
          20260915191041 route_checkout_inventory_sales_to_sale_rpc
          20260915191048 bind_checkout_inventory_audit_key
          20260915191200 secure_checkout_inventory_gateway
          20260915191211 lock_checkout_gateway_permissions
          20260915191407 restore_checkout_name_compatibility
          20260915191512 fix_checkout_row_lock_query
          20260915191720 optimize_remaining_rls_init_plans
          20260915191726 add_remaining_foreign_key_indexes
          20260915191800 clarify_checkout_inventory_reference
          20260915191940 remove_inventory_context_public_execute
          20260915203008 fix_has_permission_rls_deadlock
          20260915203233 server_owned_review_aggregate_fix
          20260915203305 tighten_client_table_grants
          20260915203406 move_permission_helper_to_private_schema
          20260915204114 harden_security_definer_search_paths
          20260915204121 harden_security_definer_search_paths
          20260915204140 pin_remaining_definer_paths
          20260915210502 create_cms_content_versions
          20260915223644 create_product_atomic_rpc
          '''
          root = Path('supabase/migrations')
          root.mkdir(parents=True, exist_ok=True)
          for line in versions.splitlines():
              line=line.strip()
              if not line: continue
              version,name=line.split(' ',1)
              path=root/f'{version}_{name}.sql'
              if not path.exists():
                  path.write_text('-- Compatibility marker: migration already applied to the linked Supabase project.\n-- Equivalent changes are retained in the current local migration chain.\n')
      - name: Remove one-off workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/oneoff-reconcile-remote-migrations.yml
          git add supabase/migrations .github/workflows/oneoff-reconcile-remote-migrations.yml
          git commit -m 'chore: reconcile remote migration history'
          git push
