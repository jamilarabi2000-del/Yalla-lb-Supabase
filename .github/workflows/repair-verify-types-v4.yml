name: repair-verify-types-v4
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'jamilarabi2000-del'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted TypeScript fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/context/ShopContext.tsx')
          s = p.read_text()
          old = "if (err?.name === 'NonUuidProductIdsError') return;"
          new = "if (err instanceof Error && err.name === 'NonUuidProductIdsError') return;"
          if old not in s:
              raise SystemExit('wishlist error guard pattern not found')
          s = s.replace(old, new, 1)

          old = """const { data, error } = await executeWithRetry(() =>\n        supabase.auth.signInWithPassword({\n          email: cleanEmail,\n          password: pass,\n        })\n      );"""
          new = """const { data, error } = await executeWithRetry<{\n        data: { user: SupabaseUser | null; session: Session | null };\n        error: AuthError | null;\n      }>(() =>\n        supabase.auth.signInWithPassword({\n          email: cleanEmail,\n          password: pass,\n        })\n      );"""
          if old not in s:
              raise SystemExit('signInWithEmail retry pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/firebase.ts')
          s = p.read_text()
          old = "import { supabase } from './lib/supabase';"
          new = "import { supabase } from './lib/supabase';\nimport type { AuthChangeEvent, Session } from '@supabase/supabase-js';"
          if old not in s:
              raise SystemExit('firebase import anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Remove repair workflow and commit
        run: |
          rm -f .github/workflows/repair-verify-types-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/ShopContext.tsx src/firebase.ts .github/workflows/repair-verify-types-v4.yml
          git diff --cached --check
          git commit -m 'fix: resolve final compatibility type errors'
          git push origin main
