name: Fix final compatibility types
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply fixes and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/context/ShopContext.tsx')
          s=p.read_text()
          s=s.replace("if (err?.name === 'NonUuidProductIdsError') return;", "if (err instanceof Error && err.name === 'NonUuidProductIdsError') return;", 1)
          old="""      const { data, error } = await executeWithRetry(() =>\n        supabase.auth.signInWithPassword({\n          email: cleanEmail,\n          password: pass,\n        })\n      );"""
          new="""      const result = await executeWithRetry(() =>\n        supabase.auth.signInWithPassword({\n          email: cleanEmail,\n          password: pass,\n        })\n      );\n      const { data, error } = result as {\n        data: { user: SupabaseUser | null; session: Session | null };\n        error: AuthError | null;\n      };"""
          if old not in s: raise SystemExit('sign-in pattern missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/ShopContext.tsx
          git commit -m 'fix: resolve final compatibility type errors' || true
          git push origin main || true
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-final-types.yml || true
          git commit -m 'chore: remove temporary type-fix workflow' || true
          git push origin main || true
