name: Fix final compatibility types
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/context/ShopContext.tsx')
          s=p.read_text()
          old="""        .catch((err: unknown) => {\n          console.error('[ShopContext] Failed to save wishlist to Supabase:', err);\n\n          // The catalog is still serving bundled demo slugs, so the ids cannot\n          // go into a uuid[] column. That is a migration state to fix, not a\n          // server fault, and telling the shopper the server failed would be\n          // wrong — so it is loud in the console and silent in the UI.\n          if (err?.name === 'NonUuidProductIdsError') return;\n"""
          new="""        .catch((err: unknown) => {\n          console.error('[ShopContext] Failed to save wishlist to Supabase:', err);\n\n          // The catalog is still serving bundled demo slugs, so the ids cannot\n          // go into a uuid[] column. That is a migration state to fix, not a\n          // server fault, and telling the shopper the server failed would be\n          // wrong — so it is loud in the console and silent in the UI.\n          if (err instanceof Error && err.name === 'NonUuidProductIdsError') return;\n"""
          if old not in s: raise SystemExit('wishlist pattern missing')
          s=s.replace(old,new,1)
          old2="""      const { data, error } = await executeWithRetry(() =>\n        supabase.auth.signInWithPassword({\n          email: cleanEmail,\n          password: pass,\n        })\n      );\n"""
          new2="""      const result = await executeWithRetry(() =>\n        supabase.auth.signInWithPassword({\n          email: cleanEmail,\n          password: pass,\n        })\n      );\n      const { data, error } = result as {\n        data: { user: SupabaseUser | null; session: Session | null };\n        error: AuthError | null;\n      };\n"""
          if old2 not in s: raise SystemExit('sign-in pattern missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          npm install --no-audit --no-fund
          npm run lint
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/ShopContext.tsx
          git commit -m 'fix: resolve final compatibility type errors' || exit 0
          git push origin main
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-final-types.yml
          git commit -m 'chore: remove temporary type-fix workflow'
          git push origin main
