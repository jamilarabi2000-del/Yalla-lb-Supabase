name: One-time TypeScript Repair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-type-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compatibility repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/types.ts')
          s = p.read_text()
          s = s.replace("export interface Seller {\n  id: string;", "export interface Seller {\n  id: string;\n  legacyId?: string;")
          s = s.replace("export interface CategoryItem {\n  id: string;", "export interface CategoryItem {\n  id: string;\n  legacyId?: string;")
          p.write_text(s)

          p = Path('src/utils/dbLogger.ts')
          s = p.read_text()
          marker = "export const dbLogger = new DatabaseLoggerService();"
          replacement = '''export const dbLogger = Object.assign(new DatabaseLoggerService(), {\n  logDbWriteStart(params: Parameters<DatabaseLoggerService['logFirestoreWriteStart']>[0]) { return (this as DatabaseLoggerService).logFirestoreWriteStart(params); },\n  logDbWriteSuccess(params: Parameters<DatabaseLoggerService['logFirestoreWriteSuccess']>[0]) { return (this as DatabaseLoggerService).logFirestoreWriteSuccess(params); },\n  logDbWriteError(params: Parameters<DatabaseLoggerService['logFirestoreWriteError']>[0]) { return (this as DatabaseLoggerService).logFirestoreWriteError(params); },\n});'''
          if marker not in s: raise SystemExit('dbLogger marker not found')
          p.write_text(s.replace(marker, replacement, 1))

          p = Path('src/services/supabaseCatalogService.ts')
          s = p.read_text()
          s = s.replace("    let query =\n      supabase\n        .from('products')", "    let query: any =\n      supabase\n        .from('products')", 1)
          p.write_text(s)
          PY
      - name: Commit repairs
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types.ts src/utils/dbLogger.ts src/services/supabaseCatalogService.ts
          git commit -m 'fix: resolve Supabase migration TypeScript compatibility'
          git push
