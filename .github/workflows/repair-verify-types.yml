name: Repair verify type errors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'jamilarabi2000-del'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply targeted type fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_line(path, line_no, old, new):
              p = Path(path)
              lines = p.read_text().splitlines(True)
              i = line_no - 1
              if i < 0 or i >= len(lines):
                  raise SystemExit(f'{path}: line {line_no} missing')
              if old not in lines[i]:
                  raise SystemExit(f'{path}: expected text not found at line {line_no}: {lines[i].rstrip()}')
              lines[i] = lines[i].replace(old, new, 1)
              p.write_text(''.join(lines))

          # Order tracking: compatibility DocumentSnapshot.data() is optional.
          replace_line('src/components/OrderHistory.tsx', 114,
                       'docSnap.data().userId',
                       '(docSnap.data() as Order).userId')

          # ShopContext callback parameters lost contextual typing because the
          # temporary compatibility client is intentionally exported as any.
          replace_line('src/context/ShopContext.tsx', 1026, 'row =>', '(row: Record<string, unknown>) =>')
          for n in (1577, 2487, 2576):
              replace_line('src/context/ShopContext.tsx', n, 'status =>', '(status: string) =>')

          # Auth callbacks: use Supabase's actual callback types.
          p = Path('src/context/ShopContext.tsx')
          s = p.read_text()
          s = s.replace("  User as SupabaseUser,\n  EmailOtpType\n", "  User as SupabaseUser,\n  EmailOtpType,\n  Session,\n  AuthChangeEvent,\n  AuthError\n")
          lines = s.splitlines(True)
          replacements = {
              2828: ('({ session, error })', '({ session, error }: { session: Session | null; error: AuthError | null })'),
              2833: ('catch (err)', 'catch (err: unknown)'),
              2839: ('(event, session)', '(event: AuthChangeEvent, session: Session | null)'),
          }
          for n, (old, new) in replacements.items():
              i=n-1
              if old not in lines[i]:
                  raise SystemExit(f'ShopContext line {n}: expected {old!r}, got {lines[i].rstrip()!r}')
              lines[i]=lines[i].replace(old,new,1)
          p.write_text(''.join(lines))

          # The compatibility firebase auth adapter has the same untyped auth callback.
          p = Path('src/firebase.ts')
          s = p.read_text()
          s = s.replace("  User as SupabaseUser,\n", "  User as SupabaseUser,\n  Session,\n  AuthChangeEvent,\n")
          lines=s.splitlines(True)
          i=95
          if '(event, session)' in lines[i]:
              lines[i]=lines[i].replace('(event, session)', '(event: AuthChangeEvent, session: Session | null)', 1)
          elif '(_event, session)' in lines[i]:
              lines[i]=lines[i].replace('(_event, session)', '(_event: AuthChangeEvent, session: Session | null)', 1)
          else:
              raise SystemExit(f'firebase.ts line 96 unexpected: {lines[i].rstrip()}')
          p.write_text(''.join(lines))

          # databaseMonitor generic wrapper: preserve the caller's generic type.
          p = Path('src/utils/databaseMonitor.ts')
          lines=p.read_text().splitlines(True)
          i=544
          if 'return await getDoc' not in lines[i]:
              raise SystemExit(f'databaseMonitor line 545 unexpected: {lines[i].rstrip()}')
          lines[i]=lines[i].replace('return await getDoc', 'return (await getDoc', 1).rstrip('\n') + ') as DocumentSnapshot<T>;\n'
          p.write_text(''.join(lines))
          PY

      - name: Remove repair workflow and commit fixes
        run: |
          rm -f .github/workflows/repair-verify-types.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/OrderHistory.tsx src/context/ShopContext.tsx src/firebase.ts src/utils/databaseMonitor.ts .github/workflows/repair-verify-types.yml
          git diff --cached --check
          git commit -m 'fix: resolve remaining verify type errors'
          git push origin main
