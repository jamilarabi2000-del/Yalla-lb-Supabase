name: Database Migration Integrity

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-integrity:
    name: Verify migration history and schema drift
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # The previous revision called `supabase ... --linked` with no link step
      # and no configured secrets, so every run died with "Cannot find project
      # ref" before reaching the drift check. Report that as a clear skip
      # instead of a permanently red job nobody can act on.
      - name: Check required secrets
        id: secrets
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_DB_PASSWORD}" ] || [ -z "${SUPABASE_PROJECT_ID}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Migration integrity not enforced::Set the SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_ID repository secrets to enable schema drift detection."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Link Supabase project
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Verify migration history is reproducible
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          supabase migration list --linked

      # No `|| true` here. Swallowing the exit status made a CLI failure
      # indistinguishable from "no drift", which turned the gate into a
      # rubber stamp.
      - name: Fail on linked schema drift
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          supabase db diff --linked --schema public,private,storage > drift.sql
          if [ -s drift.sql ] && grep -qv '^[[:space:]]*$' drift.sql; then
            echo "Schema drift detected between repository migrations and the linked database:"
            cat drift.sql
            exit 1
          fi
          echo "No linked schema drift detected."
