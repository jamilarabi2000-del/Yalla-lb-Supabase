name: oneoff neutralize legacy discount seed
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.sha == 'ab95e0a94395718ac302394dc9fdcf824a625d02'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy discount demo initialization
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/context/ShopContext.tsx')
          s = p.read_text()
          pattern = re.compile(r"  const \[discountRules, setDiscountRules\] = useState<DiscountRule\[\]>\(\(\) => \{.*?\n  \}\);\n\n  useEffect\(\(\) => \{", re.S)
          replacement = "  // Discount rules are authoritative Supabase data; never initialize bundled/demo rules.\n  const [discountRules, setDiscountRules] = useState<DiscountRule[]>([]);\n\n  useEffect(() => {"
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'expected one discount initializer, replaced {n}')
          p.write_text(s2)
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/oneoff-neutralize-discount-seed.yml
          git add src/context/ShopContext.tsx .github/workflows/oneoff-neutralize-discount-seed.yml
          git commit -m 'security: remove legacy discount demo initialization'
          git push
