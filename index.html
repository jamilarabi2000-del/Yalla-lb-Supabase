    <script>
      (function() {
        function isIgnorable(err) {
          if (!err) return false;
          var msg = (err.message || err.name || String(err)).toLowerCase();
          return (
            msg.indexOf('database is closing') !== -1 ||
            msg.indexOf('database connection is closing') !== -1 ||
            msg.indexOf('closing/hidden') !== -1 ||
            msg.indexOf('closing') !== -1 ||
            msg.indexOf('hidden') !== -1 ||
            msg.indexOf('client is offline') !== -1 ||
            msg.indexOf('the database connection was closed') !== -1 ||
            msg.indexOf('indexeddb') !== -1 ||
            msg.indexOf('aborterror') !== -1 ||
            msg.indexOf('quotaexceedederror') !== -1
          );
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isIgnorable(event.reason)) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isIgnorable(event.error) || isIgnorable(event.message)) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
